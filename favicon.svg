<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Aiman Hazim">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0b1120"/>
  <rect x="3" y="3" width="94" height="94" rx="21" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.5"/>
  <g transform="translate(14,24.8) scale(0.72)">
    <!-- antenna -->
    <line x1="50" y1="20" x2="50" y2="7" stroke="#e9eef9" stroke-width="3" stroke-linecap="round"/>
    <circle cx="50" cy="5" r="6.5" fill="#38bdf8" opacity="0.25"/>
    <circle cx="50" cy="5" r="3.4" fill="#38bdf8"/>
    <!-- ears -->
    <rect x="8" y="37" width="9" height="18" rx="3" fill="#e9eef9"/>
    <rect x="83" y="37" width="9" height="18" rx="3" fill="#e9eef9"/>
    <!-- head -->
    <rect x="18" y="20" width="64" height="52" rx="15" fill="#e9eef9"/>
    <!-- eyes -->
    <circle cx="38" cy="46" r="7" fill="#38bdf8"/>
    <circle cx="62" cy="46" r="7" fill="#38bdf8"/>
    <!-- mouth -->
    <rect x="40" y="60" width="20" height="3.4" rx="1.7" fill="#38bdf8" opacity="0.55"/>
  </g>
</svg>
