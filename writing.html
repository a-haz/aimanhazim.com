  <script>

        var t = localStorage.getItem('ah-theme');
        if (t !== 'light' && t !== 'dark') {

        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>
